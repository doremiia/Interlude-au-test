
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Interlude AU — an interactive fictional phone experience.">
  <title>Interlude AU</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <!-- Kumpulan ikon SVG supaya konsisten di home screen dan dock -->
  <svg xmlns="http://www.w3.org/2000/svg"
       style="position:absolute;width:0;height:0;overflow:hidden"
       aria-hidden="true">

    <symbol id="svg-messages" viewBox="0 0 48 48">
      <path d="M24 5C13 5 5 12 5 21c0 5 3 10 8 13l-2 8 10-5c1 .2 2 .3 3 .3 11 0 19-7 19-16S35 5 24 5Z" fill="#fff"/>
    </symbol>

    <symbol id="svg-instagram" viewBox="0 0 48 48">
      <rect x="5" y="5" width="38" height="38" rx="11" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="24" cy="24" r="9" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="35" cy="13" r="2.5" fill="#fff"/>
    </symbol>

    <symbol id="svg-photos" viewBox="0 0 48 48">
      <g transform="translate(24 24)">
        <ellipse cy="-10" rx="6.5" ry="10" fill="#ff6259"/>
        <ellipse cy="-10" rx="6.5" ry="10" fill="#ffb64c" transform="rotate(60)"/>
        <ellipse cy="-10" rx="6.5" ry="10" fill="#ffe45b" transform="rotate(120)"/>
        <ellipse cy="-10" rx="6.5" ry="10" fill="#63cf78" transform="rotate(180)"/>
        <ellipse cy="-10" rx="6.5" ry="10" fill="#45b9ef" transform="rotate(240)"/>
        <ellipse cy="-10" rx="6.5" ry="10" fill="#a478f2" transform="rotate(300)"/>
        <circle r="4" fill="#fff"/>
      </g>
    </symbol>

    <symbol id="svg-notes" viewBox="0 0 48 48">
      <rect x="6" y="4" width="36" height="40" rx="4" fill="#fff"/>
      <path d="M6 15H42" stroke="#f3c94c" stroke-width="7"/>
      <path d="M13 23H35M13 29H35M13 35H30" stroke="#d0d0d4" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="svg-safari" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="22" fill="#fff"/>
      <circle cx="24" cy="24" r="19" fill="#168ee9"/>
      <circle cx="24" cy="24" r="15" fill="none" stroke="#b8e7ff" stroke-width="1"/>
      <path d="M31 13L26 26L15 35L22 22Z" fill="#fff"/>
      <path d="M17 35L22 22L33 13L26 26Z" fill="#ff4d5c"/>
    </symbol>

    <symbol id="svg-phone" viewBox="0 0 48 48">
      <path d="M12 5L20 14L16 19Q20 28 29 32L34 27L43 35L39 42Q36 45 30 42C18 37 9 28 5 17Q3 11 8 7Z" fill="#fff"/>
    </symbol>

    <symbol id="svg-contacts" viewBox="0 0 48 48">
      <rect x="9" y="5" width="30" height="38" rx="5" fill="#fff"/>
      <circle cx="24" cy="18" r="7" fill="#d9a56e"/>
      <path d="M12 37Q13 26 24 26Q35 26 36 37Z" fill="#d9a56e"/>
    </symbol>

    <symbol id="svg-calendar" viewBox="0 0 48 48">
      <rect x="4" y="5" width="40" height="38" rx="5" fill="#fff"/>
      <path d="M4 16H44" stroke="#ed454b" stroke-width="9"/>
      <path d="M15 3V10M33 3V10" stroke="#b7b7bb" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#292929">1</text>
    </symbol>

    <symbol id="svg-files" viewBox="0 0 48 48">
      <path d="M4 12Q4 8 8 8H20L25 13H40Q44 13 44 17V36Q44 40 40 40H8Q4 40 4 36Z" fill="#fff"/>
      <path d="M6 20H42L38 36H10Z" fill="#d7edff"/>
    </symbol>

    <symbol id="svg-settings" viewBox="0 0 48 48">
      <path d="M20 3H28L30 9L35 11L41 9L45 17L40 21V28L45 32L41 40L34 38L29 41L28 46H20L19 41L13 38L7 40L3 32L8 28V21L3 17L7 9L14 11L19 9Z" fill="#fff"/>
      <circle cx="24" cy="24" r="9" fill="#9298a2"/>
      <circle cx="24" cy="24" r="4" fill="#e7e9ed"/>
    </symbol>

  </svg>

  <main id="phone" class="phone" aria-label="Interlude virtual phone">

    <!-- STATUS BAR -->
    <header id="status-bar" class="status-bar">
      <span id="status-time">9:41</span>
      <div class="status-icons" aria-label="Phone status">
        <span class="signal-icon" aria-label="Signal">●●●</span>
        <span class="wifi-icon" aria-label="Wi-Fi">Wi-Fi</span>
        <span class="battery" aria-label="Battery">
          <span class="battery-level"></span>
        </span>
      </div>
    </header>

    <!-- LOCK SCREEN -->
    <section id="lock-screen" class="screen lock-screen" aria-label="Lock screen">
      <div class="lock-content">
        <p id="lock-date" class="lock-date">Monday, September 1</p>
        <h1 id="lock-time" class="lock-time">09:41</h1>
        <p class="lock-subtitle">Interlude AU</p>
      </div>

      <div id="notification-area" class="notification-area"
           aria-label="Notifications" aria-live="polite"></div>

      <div class="lock-bottom">
        <button id="flashlight-button" class="lock-shortcut"
                type="button" aria-label="Flashlight" disabled>
          ◉
        </button>

        <button id="unlock-button" class="unlock-button" type="button">
          Tap to unlock
        </button>

        <button id="camera-button" class="lock-shortcut"
                type="button" aria-label="Camera" disabled>
          ▣
        </button>
      </div>
    </section>

    <!-- PASSCODE -->
    <section id="passcode-screen" class="screen passcode-screen"
             aria-label="Passcode screen" hidden>
      <div class="passcode-content">
        <h2 class="passcode-title">Enter Passcode</h2>
        <p class="passcode-description">Enter your passcode to continue.</p>

        <div id="passcode-dots" class="passcode-dots"
             aria-label="Passcode entry" aria-live="polite">
          <span class="passcode-dot"></span>
          <span class="passcode-dot"></span>
          <span class="passcode-dot"></span>
          <span class="passcode-dot"></span>
        </div>

        <p id="passcode-error" class="passcode-error"
           role="status" aria-live="polite"></p>

        <div id="passcode-keypad" class="passcode-keypad">
          <button type="button" class="passcode-key" data-digit="1">1</button>
          <button type="button" class="passcode-key" data-digit="2">2</button>
          <button type="button" class="passcode-key" data-digit="3">3</button>
          <button type="button" class="passcode-key" data-digit="4">4</button>
          <button type="button" class="passcode-key" data-digit="5">5</button>
          <button type="button" class="passcode-key" data-digit="6">6</button>
          <button type="button" class="passcode-key" data-digit="7">7</button>
          <button type="button" class="passcode-key" data-digit="8">8</button>
          <button type="button" class="passcode-key" data-digit="9">9</button>
          <button type="button" id="passcode-delete" class="passcode-action">Delete</button>
          <button type="button" class="passcode-key" data-digit="0">0</button>
          <button type="button" id="passcode-cancel" class="passcode-action">Cancel</button>
        </div>
      </div>
    </section>

    <!-- HOME SCREEN -->
    <section id="home-screen" class="screen home-screen"
             aria-label="Home screen" hidden>

      <header class="home-header">
        <p id="home-date" class="home-date">Monday, September 1</p>
        <p class="home-greeting">Your little world.</p>
      </header>

      <!-- APP GRID -->
      <nav id="app-grid" class="app-grid" aria-label="Applications">

        <button class="app-item" type="button" data-app="messages">
          <span class="app-icon icon-messages" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-messages"/></svg>
          </span>
          <span class="app-label">Messages</span>
        </button>

        <button class="app-item" type="button" data-app="instagram">
          <span class="app-icon icon-instagram" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-instagram"/></svg>
          </span>
          <span class="app-label">Instagram</span>
        </button>

        <button class="app-item" type="button" data-app="photos">
          <span class="app-icon icon-photos" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-photos"/></svg>
          </span>
          <span class="app-label">Photos</span>
        </button>

        <button class="app-item" type="button" data-app="notes">
          <span class="app-icon icon-notes" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-notes"/></svg>
          </span>
          <span class="app-label">Notes</span>
        </button>

        <button class="app-item" type="button" data-app="safari">
          <span class="app-icon icon-safari" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-safari"/></svg>
          </span>
          <span class="app-label">Safari</span>
        </button>

        <button class="app-item" type="button" data-app="phone">
          <span class="app-icon icon-phone" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-phone"/></svg>
          </span>
          <span class="app-label">Phone</span>
        </button>

        <button class="app-item" type="button" data-app="contacts">
          <span class="app-icon icon-contacts" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-contacts"/></svg>
          </span>
          <span class="app-label">Contacts</span>
        </button>

        <button class="app-item" type="button" data-app="calendar">
          <span class="app-icon icon-calendar" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-calendar"/></svg>
          </span>
          <span class="app-label">Calendar</span>
        </button>

        <button class="app-item" type="button" data-app="files">
          <span class="app-icon icon-files" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-files"/></svg>
          </span>
          <span class="app-label">Files</span>
        </button>

        <button class="app-item" type="button" data-app="settings">
          <span class="app-icon icon-settings" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-settings"/></svg>
          </span>
          <span class="app-label">Settings</span>
        </button>
      </nav>

      <!-- DOCK -->
      <nav id="app-dock" class="app-dock" aria-label="Dock">
        <button class="dock-item" type="button" data-app="phone" aria-label="Phone">
          <span class="app-icon icon-phone" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-phone"/></svg>
          </span>
        </button>

        <button class="dock-item" type="button" data-app="messages" aria-label="Messages">
          <span class="app-icon icon-messages" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-messages"/></svg>
          </span>
        </button>

        <button class="dock-item" type="button" data-app="safari" aria-label="Safari">
          <span class="app-icon icon-safari" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-safari"/></svg>
          </span>
        </button>

        <button class="dock-item" type="button" data-app="photos" aria-label="Photos">
          <span class="app-icon icon-photos" aria-hidden="true">
            <svg viewBox="0 0 48 48"><use href="#svg-photos"/></svg>
          </span>
        </button>
      </nav>
    </section>

    <!-- APP SCREEN -->
    <section id="app-screen" class="screen app-screen"
             aria-label="Open application" hidden>
      <header class="app-header">
        <button id="app-back-button" class="app-back-button"
                type="button" aria-label="Back">‹</button>
        <h2 id="app-title" class="app-title">Application</h2>
        <button id="app-menu-button" class="app-menu-button"
                type="button" aria-label="More options">•••</button>
      </header>

      <div id="app-content" class="app-content"></div>
    </section>

    <!-- HOME INDICATOR -->
    <button id="home-indicator" class="home-indicator"
            type="button" aria-label="Return to home screen"></button>

  </main>

  <!-- Penutup body -->
</body>
</html>
